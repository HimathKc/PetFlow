<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Manage Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-wrap">
    <div class="sidebar" id="sidebar"></div>

    <div class="flex-grow-1 p-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Manage Pets</h2>
        <a href="admin-pet-form.html" class="btn btn-main"><i class="bi bi-plus-lg"></i> Add New Pet</a>
      </div>

      <div class="box">
        <input type="text" id="search" class="form-control mb-3" placeholder="Search pets...">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Photo</th><th>Name</th><th>Type</th><th>Breed</th><th>Age</th><th>Actions</th></tr></thead>
            <tbody id="petTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    loadSidebar("Pets");

    function showTable() {
      var text = document.getElementById("search").value.toLowerCase();
      var html = "";
      pets.forEach(function (p) {
        if ((p.name + p.breed + p.type).toLowerCase().includes(text)) {
          html += '<tr><td><img src="' + p.img + '" width="55" height="45" class="rounded" style="object-fit:cover"></td>' +
            "<td>" + p.name + "</td><td>" + p.type + "</td><td>" + p.breed + "</td><td>" + p.age + "</td><td>" +
            '<a href="pet-details.html?id=' + p.id + '" class="btn btn-sm btn-light-main me-1"><i class="bi bi-eye"></i></a>' +
            '<a href="admin-pet-form.html?id=' + p.id + '" class="btn btn-sm btn-main me-1"><i class="bi bi-pencil"></i></a>' +
            '<button class="btn btn-sm btn-danger" onclick="deletePet(' + p.id + ')"><i class="bi bi-trash"></i></button></td></tr>';
        }
      });
      document.getElementById("petTable").innerHTML = html;
    }

    function deletePet(id) {
      if (confirm("Are you sure you want to delete this pet?")) {
        pets = pets.filter(function (p) { return p.id !== id; });
        showTable();
        showToast("Pet deleted");
      }
    }

    document.getElementById("search").addEventListener("keyup", showTable);
    showTable();
  </script>
</body>
</html>
