<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Adoption Request</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-5" style="max-width: 700px;">
    <a href="pet-details.html" id="backLink" class="text-decoration-none text-dark fw-bold"><i class="bi bi-arrow-left"></i> Back</a>
    <div class="box mt-3">
      <h2>Adopt <span id="petName"></span></h2>
      <p>Please fill in the form and our team will contact you.</p>

      <form id="adoptForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Why do you want to adopt?</label>
          <textarea id="message" class="form-control" rows="4"></textarea>
        </div>
        <button class="btn btn-main w-100">Submit Request</button>
      </form>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/adopt.js"></script>
</body>
</html>
