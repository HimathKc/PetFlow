<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-wrap">
    <div class="sidebar" id="sidebar"></div>

    <div class="flex-grow-1 p-4 position-relative">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="mb-0">Admin Dashboard</h2>
          <small>Welcome back! Here's what's happening with PetCare.</small>
        </div>
        <div class="text-end"><i class="bi bi-bell fs-5 me-3"></i><b>Admin</b> <small>Administrator</small></div>
      </div>

      <!-- stats -->
      <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="stat-card"><span class="fs-2">🐾</span><div><small>Total Pets</small><h3 id="totalPets"></h3><small>All pets in our system</small></div></div></div>
        <div class="col-md-4"><div class="stat-card"><i class="bi bi-heart-fill"></i><div><small>Total Requests</small><h3 id="totalReq"></h3><small>All adoption requests</small></div></div></div>
        <div class="col-md-4"><div class="stat-card"><i class="bi bi-hourglass-split"></i><div><small>Pending Requests</small><h3 id="pendingReq"></h3><small>Waiting for a decision</small></div></div></div>
      </div>

      <!-- recent requests -->
      <div class="box">
        <div class="d-flex justify-content-between">
          <h5>Recent Adoption Requests</h5>
          <a href="admin-requests.html" class="small fw-bold text-warning text-decoration-none">View All</a>
        </div>
        <div class="table-responsive">
          <table class="table">
            <thead><tr><th>Request ID</th><th>Pet</th><th>Requester</th><th>Date</th><th>Status</th></tr></thead>
            <tbody id="recent"></tbody>
          </table>
        </div>
      </div>

      <div class="mt-4">
        <a href="admin-pet-form.html" class="btn btn-main me-2"><i class="bi bi-plus-lg"></i> Add New Pet</a>
        <a href="admin-pets.html" class="btn btn-light-main">Manage Pets</a>
      </div>

      <img class="cat-pic" src="photos/catsleeping.webp" alt="Sleeping cat">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
