<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Settings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-wrap">
    <div class="sidebar" id="sidebar"></div>

    <div class="flex-grow-1 p-4">
      <h2 class="mb-4">Settings</h2>
      <div class="row g-4">
        <div class="col-lg-6">
          <div class="box">
            <h5>Profile</h5>
            <form id="profileForm" novalidate>
              <div class="mb-3"><label class="form-label">Name</label><input type="text" id="pname" class="form-control" value="Admin"></div>
              <div class="mb-3"><label class="form-label">Email</label><input type="email" id="pemail" class="form-control" value="admin@petcare.com"></div>
              <button class="btn btn-main">Save Profile</button>
            </form>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="box">
            <h5>Change Password</h5>
            <form id="passForm" novalidate>
              <div class="mb-3"><label class="form-label">New Password</label><input type="password" id="newpass" class="form-control"></div>
              <div class="mb-3"><label class="form-label">Confirm Password</label><input type="password" id="confpass" class="form-control"></div>
              <button class="btn btn-main">Update Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    loadSidebar("Settings");

    document.getElementById("profileForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("pname");
      var email = document.getElementById("pemail");
      var ok = true;
      if (name.value.trim() === "") { showError(name, "Name is required"); ok = false; } else showError(name, "");
      if (!isEmail(email.value)) { showError(email, "Enter a valid email"); ok = false; } else showError(email, "");
      if (ok) showToast("Profile saved!");
    });

    document.getElementById("passForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var p1 = document.getElementById("newpass");
      var p2 = document.getElementById("confpass");
      var ok = true;
      if (p1.value.length < 6) { showError(p1, "At least 6 characters"); ok = false; } else showError(p1, "");
      if (p1.value !== p2.value) { showError(p2, "Passwords do not match"); ok = false; } else showError(p2, "");
      if (ok) { showToast("Password updated!"); this.reset(); }
    });
  </script>
</body>
</html>
