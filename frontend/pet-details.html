<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Pet Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-4">
    <a href="browse.html" id="backLink" class="text-decoration-none text-dark fw-bold"><i class="bi bi-arrow-left"></i> Back to Browse</a>

    <div class="row g-4 mt-1">
      <!-- images -->
      <div class="col-md-6">
        <img id="mainImg" class="main-img" src="" alt="Pet">
        
      </div>

      <!-- info -->
      <div class="col-md-6">
        <div class="box">
          <h2><span id="pName"></span> <span id="pType" class="badge bg-warning text-dark fs-6"></span></h2>
          <table class="table table-borderless mt-3">
            <tr><td><i class="bi bi-calendar me-2"></i>Age</td><td id="pAge"></td></tr>
            <tr><td><i class="bi bi-tag me-2"></i>Breed</td><td id="pBreed"></td></tr>
            <tr><td><i class="bi bi-info-circle me-2"></i>Status</td><td id="pStatus"></td></tr>
          </table>
          <h4>About <span id="pName2"></span></h4>
          <p id="pAbout"></p>
          <a id="adoptBtn" href="#" class="btn btn-main btn-lg w-100"><i class="bi bi-heart"></i> Adopt Me</a>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/pet-details.js"></script>
</body>
</html>
