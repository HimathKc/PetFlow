<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Browse Pets</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-5">
    <h1 class="mb-4">Browse Our Pets</h1>

    <!-- search + filters -->
    <div class="row g-3 mb-4 align-items-center">
      <div class="col-md-6">
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="text" id="search" class="form-control" placeholder="Search by name, breed, or keyword...">
        </div>
      </div>
      <div class="col-md-6">
        <button class="chip active" onclick="setFilter('All', this)">All</button>
        <button class="chip" onclick="setFilter('Dog', this)">Dogs</button>
        <button class="chip" onclick="setFilter('Cat', this)">Cats</button>
        <button class="chip" onclick="setFilter('Others', this)">Others</button>
      </div>
    </div>

    <div class="row g-4" id="petList"></div>
    <p id="noResult" class="text-center d-none">No pets found.</p>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    loadNavbar("Browse Pets");
    loadFooter();

    var currentType = "All";

    function showPets() {
      var text = document.getElementById("search").value.toLowerCase();
      var html = "";
      pets.forEach(function (p) {
        var matchType = currentType === "All" || p.type === currentType;
        var matchText = (p.name + p.breed + p.short).toLowerCase().includes(text);
        if (matchType && matchText) html += petCard(p);
      });
      document.getElementById("petList").innerHTML = html;
      document.getElementById("noResult").classList.toggle("d-none", html !== "");
    }

    function setFilter(type, btn) {
      currentType = type;
      document.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
      btn.classList.add("active");
      showPets();
    }

    document.getElementById("search").addEventListener("keyup", showPets);
    showPets();
  </script>
</body>
</html>
