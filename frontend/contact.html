<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Contact</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-5">
    <h1 class="mb-4">Contact Us</h1>
    <div class="row g-4">
      <div class="col-md-5">
        <div class="box h-100">
          <h5><i class="bi bi-geo-alt text-warning"></i> Address</h5>
          <p>123 Paw Street, Colombo, Sri Lanka</p>
          <h5><i class="bi bi-telephone text-warning"></i> Phone</h5>
          <p>+94 11 234 5678</p>
          <h5><i class="bi bi-envelope text-warning"></i> Email</h5>
          <p>hello@petcare.com</p>
          <h5><i class="bi bi-clock text-warning"></i> Opening Hours</h5>
          <p class="mb-0">Mon - Sat, 9.00 a.m. - 5.00 p.m.</p>
        </div>
      </div>
      <div class="col-md-7">
        <div class="box">
          <form id="contactForm" novalidate>
            <div class="mb-3">
              <label class="form-label">Name</label>
              <input type="text" id="name" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" id="email" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea id="message" rows="4" class="form-control"></textarea>
            </div>
            <button class="btn btn-main">Send Message</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
