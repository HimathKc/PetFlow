<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-5" style="max-width: 450px;">
    <div class="box">
      <h2 class="text-center mb-1">Welcome Back</h2>
      <p class="text-center small">Login to your PetCare account</p>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control">
        </div>
        <button class="btn btn-main w-100">Login</button>
      </form>

      <p class="text-center small mt-3 mb-1">No account? <a href="signup.html">Sign Up</a></p>
      <p class="text-center small text-muted mb-0">User demo: user@petcare.com / user123</p>
      <p class="text-center small text-muted mb-0">Admin demo: admin@petcare.com / admin123</p>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    loadNavbar("");
    loadFooter();

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("email");
      var password = document.getElementById("password");
      var ok = true;

      if (!isEmail(email.value)) { showError(email, "Enter a valid email"); ok = false; } else showError(email, "");
      if (password.value.length < 6) { showError(password, "Password must be at least 6 characters"); ok = false; } else showError(password, "");
      if (!ok) return;

      // demo login only - PHP + MySQL will replace this later
      if (email.value === "user@petcare.com" && password.value === "user123") {
        localStorage.setItem("petcareUser", "User");
        localStorage.setItem("petcareRole", "user");
        window.location.href = "index.html";
      } else if (email.value === "admin@petcare.com" && password.value === "admin123") {
        localStorage.setItem("petcareUser", "Admin");
        localStorage.setItem("petcareRole", "admin");
        window.location.href = "admin-dashboard.html";
      } else {
        localStorage.setItem("petcareUser", email.value.split("@")[0]);
        localStorage.setItem("petcareRole", "user");
        window.location.href = "index.html";
      }
    });
  </script>
</body>
</html>
