<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Adoption Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-wrap">
    <div class="sidebar" id="sidebar"></div>

    <div class="flex-grow-1 p-4">
      <h2 class="mb-4">Adoption Requests</h2>

      <div class="box">
        <div class="mb-3">
          <button class="chip active" onclick="setFilter('All', this)">All</button>
          <button class="chip" onclick="setFilter('Pending', this)">Pending</button>
          <button class="chip" onclick="setFilter('Approved', this)">Approved</button>
          <button class="chip" onclick="setFilter('Rejected', this)">Rejected</button>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>Request ID</th><th>Pet</th><th>Requester</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="reqTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    loadSidebar("Adoption Requests");
    var filter = "All";

    function showRequests() {
      var html = "";
      requests.forEach(function (r, i) {
        if (filter === "All" || r.status === filter) {
          html += "<tr><td>" + r.id + "</td><td>" + r.pet + "</td><td>" + r.name + "</td><td>" + r.date +
            '</td><td><span class="badge-status st-' + r.status + '">' + r.status + "</span></td><td>" +
            '<button class="btn btn-sm btn-success me-1" onclick="setStatus(' + i + ', \'Approved\')">Approve</button>' +
            '<button class="btn btn-sm btn-danger me-1" onclick="setStatus(' + i + ', \'Rejected\')">Reject</button>' +
            '<button class="btn btn-sm btn-light-main" onclick="deleteRequest(' + i + ')"><i class="bi bi-trash"></i></button></td></tr>';
        }
      });
      document.getElementById("reqTable").innerHTML = html || '<tr><td colspan="6" class="text-center">No requests</td></tr>';
    }

    function setStatus(index, status) {
      requests[index].status = status;
      showRequests();
      showToast("Request " + status.toLowerCase());
    }

    function deleteRequest(index) {
      if (confirm("Delete this request?")) {
        requests.splice(index, 1);
        showRequests();
      }
    }

    function setFilter(status, btn) {
      filter = status;
      document.querySelectorAll(".chip").forEach(function (c) { c.classList.remove("active"); });
      btn.classList.add("active");
      showRequests();
    }

    showRequests();
  </script>
</body>
</html>
