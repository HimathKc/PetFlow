<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-wrap">
    <div class="sidebar" id="sidebar"></div>

    <div class="flex-grow-1 p-4">
      <h2 class="mb-4">Users</h2>
      <div class="box">
        <input type="text" id="search" class="form-control mb-3" placeholder="Search users by name or email...">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>#</th><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody id="userTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    loadSidebar("Users");

    function showUsers() {
      var text = document.getElementById("search").value.toLowerCase();
      var html = "";
      users.forEach(function (u, i) {
        if ((u.name + u.email).toLowerCase().includes(text)) {
          var btnText = u.status === "Active" ? "Block" : "Unblock";
          html += "<tr><td>" + u.id + "</td><td>" + u.name + "</td><td>" + u.email + "</td><td>" + u.role +
            '</td><td><span class="badge-status st-' + u.status + '">' + u.status + "</span></td><td>" +
            '<button class="btn btn-sm btn-main me-1" onclick="toggleUser(' + i + ')">' + btnText + "</button>" +
            '<button class="btn btn-sm btn-danger" onclick="deleteUser(' + i + ')"><i class="bi bi-trash"></i></button></td></tr>';
        }
      });
      document.getElementById("userTable").innerHTML = html;
    }

    function toggleUser(i) {
      users[i].status = users[i].status === "Active" ? "Blocked" : "Active";
      showUsers();
    }

    function deleteUser(i) {
      if (confirm("Delete this user?")) {
        users.splice(i, 1);
        showUsers();
      }
    }

    document.getElementById("search").addEventListener("keyup", showUsers);
    showUsers();
  </script>
</body>
</html>
