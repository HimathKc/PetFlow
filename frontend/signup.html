<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="navbar"></div>

  <div class="container py-5" style="max-width: 450px;">
    <div class="box">
      <h2 class="text-center mb-1">Create Account</h2>
      <p class="text-center small">Join PetCare and find your new friend</p>

      <form id="signupForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" id="name" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm Password</label>
          <input type="password" id="confirm" class="form-control">
        </div>
        <button class="btn btn-main w-100">Sign Up</button>
      </form>

      <p class="text-center small mt-3 mb-0">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script>
    loadNavbar("");
    loadFooter();

    document.getElementById("signupForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var name = document.getElementById("name");
      var email = document.getElementById("email");
      var password = document.getElementById("password");
      var confirm = document.getElementById("confirm");
      var ok = true;

      if (name.value.trim().length < 3) { showError(name, "Name must be at least 3 characters"); ok = false; } else showError(name, "");
      if (!isEmail(email.value)) { showError(email, "Enter a valid email"); ok = false; } else showError(email, "");
      if (password.value.length < 6) { showError(password, "Password must be at least 6 characters"); ok = false; } else showError(password, "");
      if (confirm.value !== password.value) { showError(confirm, "Passwords do not match"); ok = false; } else showError(confirm, "");

      if (ok) {
        showToast("Account created! Please login.");
        setTimeout(function () { window.location.href = "login.html"; }, 1500);
      }
    });
  </script>
</body>
</html>
