<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PetCare - Add / Edit Pet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-wrap">
    <div class="sidebar" id="sidebar"></div>

    <div class="flex-grow-1 p-4">
      <a href="admin-pets.html" class="text-decoration-none text-dark fw-bold"><i class="bi bi-arrow-left"></i> Back to Pets</a>
      <h2 class="my-3" id="title">Add New Pet</h2>

      <div class="box">
        <form id="petForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Pet Name</label><input type="text" id="name" class="form-control"></div>
            <div class="col-md-6">
              <label class="form-label">Type</label>
              <select id="type" class="form-select"><option value="">Select...</option><option>Dog</option><option>Cat</option><option>Others</option></select>
            </div>
            <div class="col-md-6"><label class="form-label">Breed</label><input type="text" id="breed" class="form-control"></div>
            <div class="col-md-6"><label class="form-label">Age</label><input type="text" id="age" class="form-control" placeholder="e.g. 3 months"></div>
            <div class="col-12"><label class="form-label">About</label><textarea id="about" rows="3" class="form-control"></textarea></div>
            <div class="col-12">
              <label class="form-label">Photo</label>
              <input type="file" id="photo" class="form-control" accept="image/*">
              <img id="preview" class="mt-2 rounded d-none" width="150" alt="Preview">
            </div>
          </div>
          <button class="btn btn-main mt-4">Save Pet</button>
          <a href="admin-pets.html" class="btn btn-light-main mt-4 ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin-pet-form.js"></script>
</body>
</html>
